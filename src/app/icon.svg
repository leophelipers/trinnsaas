<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151C" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="50%" stop-color="#FF3A00" />
      <stop offset="100%" stop-color="#CC2900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF5500" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />

  <!-- Glowing Emblem -->
  <rect x="8" y="8" width="48" height="48" rx="12" fill="url(#accentGrad)" filter="url(#glow)" />
  <rect x="8.5" y="8.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />

  <!-- Bold Geometric 'K' for kriativa.app -->
  <path d="M22 17h5.2v12.4l9.6-12.4h6.6l-11 13.8 11.6 16.2h-6.6l-8.6-12.3-2 2.3v10H22V17z" fill="#FFFFFF" />

  <!-- Precision Cinema Flare Indicator -->
  <circle cx="44" cy="19" r="2.5" fill="#00E5FF" />
</svg>
